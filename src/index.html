<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Orbweaver Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Without crossorigin the browser fetches the font a second time and warns the preload went unused. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Applies the saved theme before first paint, so a reload never flashes the other theme.
      // ThemeService takes over once Angular starts and uses the same key and values.
      (function () {
        var preference = 'system';
        try {
          preference = localStorage.getItem('orbweaver-admin-theme') || 'system';
        } catch (error) {
          // Site data is blocked; start from System.
        }
        var dark =
          preference === 'dark' ||
          (preference !== 'light' &&
            !!window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-ag-theme-mode', theme);
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
