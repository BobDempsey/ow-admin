schema: spec-driven

context: |
  Orbweaver Admin: an admin UI for user management, built as a take-home
  exercise. Reference: Admin_User_Management_Take-Home.pdf.

  Stack: Angular, styled with Tailwind CSS.

  The API layer is client-side over an in-memory store, written like a real
  HTTP client (request/response shapes, headers, status codes, error
  handling). There is no real backend.

  Designed for 500,000 users: the list must use server-side pagination
  (skip/limit), never client-side slicing of a full dataset.

  Accessibility target is WCAG 2.2.

  Git commits use Conventional Commits, one sentence, with no AI or tooling
  attribution.

